<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Professional News Lower Third</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .lower-third-container {
            position: absolute;
            bottom: 120px;
            left: 80px;
            right: 80px;
            height: 180px;
            display: flex;
            align-items: flex-end;
            perspective: 1000px;
        }

        .lower-third {
            display: flex;
            flex-direction: column;
            width: 100%;
            transform: translateY(300px);
            opacity: 0;
            animation: slideIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Main bar with gradient and glass effect */
        .main-bar {
            display: flex;
            align-items: center;
            height: 90px;
            background: linear-gradient(135deg,
                rgba(220, 38, 38, 0.95) 0%,
                rgba(185, 28, 28, 0.95) 50%,
                rgba(153, 27, 27, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3),
                0 0 80px rgba(220, 38, 38, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            transform: scaleX(0);
            transform-origin: left center;
            animation: expandWidth 0.6s 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* Animated gradient overlay */
        .main-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 100%);
            animation: shimmer 3s infinite linear 1.5s;
        }

        /* Breaking news badge */
        .breaking-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #000;
            padding: 8px 20px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 20px;
            border-radius: 4px;
            box-shadow:
                0 4px 15px rgba(251, 191, 36, 0.4),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite ease-in-out 1s;
            white-space: nowrap;
        }

        /* Title section */
        .title-section {
            flex: 1;
            padding: 0 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            color: #ffffff;
            font-size: 38px;
            font-weight: 700;
            line-height: 1.2;
            text-shadow:
                2px 2px 8px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateX(-30px);
            animation: fadeInText 0.6s 0.8s ease-out forwards;
            letter-spacing: -0.5px;
        }

        /* Time and logo section */
        .info-section {
            display: flex;
            align-items: center;
            padding-right: 30px;
            gap: 20px;
            opacity: 0;
            animation: fadeIn 0.5s 1s ease-out forwards;
        }

        .time {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .logo {
            width: 140px;
            height: 60px;
            background: linear-gradient(135deg, #ffffff 0%, #e5e7eb 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 28px;
            color: #dc2626;
            letter-spacing: -1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Subtitle bar */
        .subtitle-bar {
            margin-top: 10px;
            background: linear-gradient(135deg,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(23, 23, 23, 0.9) 100%);
            height: 50px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: scaleX(0);
            transform-origin: left center;
            animation: expandWidth 0.6s 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .subtitle {
            color: #f3f4f6;
            font-size: 24px;
            font-weight: 500;
            opacity: 0;
            transform: translateX(-20px);
            animation: fadeInText 0.6s 1s ease-out forwards;
            letter-spacing: 0.2px;
        }

        /* Live indicator */
        .live-indicator {
            position: absolute;
            top: -40px;
            left: 0;
            background: #ef4444;
            color: white;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideDown 0.5s 1.2s ease-out forwards;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .live-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 8px;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1.5s infinite ease-in-out;
        }

        /* Animations */
        @keyframes slideIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes expandWidth {
            to {
                transform: scaleX(1);
            }
        }

        @keyframes fadeInText {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            to {
                left: 100%;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* Exit animation class */
        .exit {
            animation: slideOut 0.6s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
        }

        .exit .main-bar,
        .exit .subtitle-bar {
            animation: collapseWidth 0.4s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
        }

        @keyframes slideOut {
            to {
                transform: translateY(300px);
                opacity: 0;
            }
        }

        @keyframes collapseWidth {
            to {
                transform: scaleX(0);
            }
        }
    </style>
</head>
<body>
    <div class="lower-third-container">
        <div class="lower-third" id="lowerThird">
            <div class="live-indicator">
                <span style="margin-left: 12px;">LIVE</span>
            </div>
            <div class="main-bar">
                <div class="breaking-badge">BREAKING</div>
                <div class="title-section">
                    <div class="title" id="title">TITOLO PRINCIPALE DELLA NOTIZIA</div>
                </div>
                <div class="info-section">
                    <div class="time" id="time">20:45</div>
                    <div class="logo">NEWS</div>
                </div>
            </div>
            <div class="subtitle-bar">
                <div class="subtitle" id="subtitle">Sottotitolo con informazioni aggiuntive sulla notizia in corso</div>
            </div>
        </div>
    </div>

    <script>
        // Update function for CasparCG
        function update(data) {
            if (data) {
                if (data.title) {
                    document.getElementById('title').textContent = data.title;
                }
                if (data.subtitle) {
                    document.getElementById('subtitle').textContent = data.subtitle;
                }
                if (data.time) {
                    document.getElementById('time').textContent = data.time;
                }
            }
        }

        // Play function for CasparCG
        function play() {
            const lowerThird = document.getElementById('lowerThird');
            lowerThird.classList.remove('exit');
        }

        // Stop function for CasparCG
        function stop() {
            const lowerThird = document.getElementById('lowerThird');
            lowerThird.classList.add('exit');

            // Notify CasparCG when animation is complete
            setTimeout(() => {
                if (window.remove) {
                    window.remove();
                }
            }, 600);
        }

        // Auto-update time
        setInterval(() => {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
        }, 1000);

        // Test mode for browser preview
        if (!window.play) {
            setTimeout(() => {
                update({
                    title: "ULTIM'ORA: Importante sviluppo nella situazione internazionale",
                    subtitle: "Le autorità confermano nuovi dettagli sull'evento in corso"
                });
            }, 100);
        }
    </script>
</body>
</html>
