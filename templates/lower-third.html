<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Third CasparCG Template</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .lower-third {
            position: absolute;
            bottom: 120px;
            left: 60px;
            width: 800px;
            height: 160px;
            background: linear-gradient(135deg,
                rgba(37, 99, 235, 0.95) 0%,
                rgba(59, 130, 246, 0.95) 50%,
                rgba(37, 99, 235, 0.95) 100%);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateX(-120%);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lower-third.animate-in {
            transform: translateX(0);
            opacity: 1;
        }

        .lower-third.animate-out {
            transform: translateX(-120%);
            opacity: 0;
        }

        .content {
            padding: 20px 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.2;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .accent-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: linear-gradient(180deg, #F59E0B 0%, #EF4444 100%);
            border-radius: 12px 0 0 12px;
        }

        .logo {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #FFFFFF;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Animation for text reveal */
        .title, .subtitle {
            animation: textReveal 0.8s ease-out 0.3s both;
        }

        .subtitle {
            animation-delay: 0.5s;
        }

        @keyframes textReveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtle pulse animation for accent bar */
        .accent-bar {
            animation: accentPulse 2s ease-in-out infinite;
        }

        @keyframes accentPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="lower-third" id="lowerThird">
        <div class="accent-bar"></div>
        <div class="content">
            <div class="title" id="title">SISTEMA iNEWS REALE</div>
            <div class="subtitle" id="subtitle">Connessione CasparCG Attiva</div>
        </div>
        <div class="logo">
            iTV
        </div>
    </div>

    <script>
        // ===================================
        // CasparCG Template Controller
        // ===================================

        let isVisible = false;
        let templateData = {
            title: 'SISTEMA iNEWS REALE',
            subtitle: 'Connessione CasparCG Attiva'
        };

        // Required CasparCG global functions
        window.play = function() {
            console.log('🎬 CasparCG PLAY command received');
            showTemplate();
        };

        window.stop = function() {
            console.log('🎬 CasparCG STOP command received');
            hideTemplate();
        };

        window.next = function() {
            console.log('🎬 CasparCG NEXT command received');
            // Not used for this template
        };

        window.update = function(data) {
            console.log('🎬 CasparCG UPDATE command received:', data);
            updateTemplate(data);
        };

        // Template control functions
        function showTemplate() {
            const element = document.getElementById('lowerThird');
            element.classList.remove('animate-out');
            element.classList.add('animate-in');
            isVisible = true;

            console.log('✅ Lower third shown');
        }

        function hideTemplate() {
            const element = document.getElementById('lowerThird');
            element.classList.remove('animate-in');
            element.classList.add('animate-out');
            isVisible = false;

            console.log('✅ Lower third hidden');
        }

        function updateTemplate(data) {
            try {
                // Parse data if it's a string
                if (typeof data === 'string') {
                    // Try to parse as JSON first
                    try {
                        data = JSON.parse(data);
                    } catch (e) {
                        // If not JSON, try to parse as XML
                        if (data.includes('<templateData>')) {
                            data = parseXMLData(data);
                        } else {
                            console.log('Data is plain string:', data);
                            return;
                        }
                    }
                }

                // Update template data
                if (data.title !== undefined) {
                    templateData.title = data.title;
                    document.getElementById('title').textContent = data.title;
                }

                if (data.subtitle !== undefined) {
                    templateData.subtitle = data.subtitle;
                    document.getElementById('subtitle').textContent = data.subtitle;
                }

                console.log('✅ Template updated:', templateData);

                // Trigger animation if visible
                if (isVisible) {
                    const titleEl = document.getElementById('title');
                    const subtitleEl = document.getElementById('subtitle');

                    titleEl.style.animation = 'none';
                    subtitleEl.style.animation = 'none';

                    setTimeout(() => {
                        titleEl.style.animation = 'textReveal 0.5s ease-out';
                        subtitleEl.style.animation = 'textReveal 0.5s ease-out 0.1s';
                    }, 10);
                }

            } catch (error) {
                console.error('❌ Error updating template:', error);
            }
        }

        // Parse CasparCG XML data format
        function parseXMLData(xmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
            const data = {};

            const components = xmlDoc.querySelectorAll('componentData');
            components.forEach(component => {
                const id = component.getAttribute('id');
                const dataElements = component.querySelectorAll('data');

                dataElements.forEach(dataEl => {
                    const dataId = dataEl.getAttribute('id');
                    const value = dataEl.getAttribute('value');

                    if (dataId === 'text') {
                        if (id === 'f0') data.title = value;
                        if (id === 'f1') data.subtitle = value;
                    }
                });
            });

            return data;
        }

        // Development helpers
        function testShow() {
            showTemplate();
            setTimeout(() => {
                updateTemplate({
                    title: 'TEST REALE ATTIVO',
                    subtitle: 'CasparCG Server Connesso'
                });
            }, 1000);
        }

        function testHide() {
            hideTemplate();
        }

        function testUpdate() {
            updateTemplate({
                title: 'AGGIORNAMENTO LIVE',
                subtitle: 'Template Aggiornato in Tempo Reale'
            });
        }

        // Keyboard shortcuts for development
        document.addEventListener('keydown', (event) => {
            if (event.ctrlKey || event.metaKey) {
                switch (event.key) {
                    case '1':
                        event.preventDefault();
                        testShow();
                        break;
                    case '2':
                        event.preventDefault();
                        testHide();
                        break;
                    case '3':
                        event.preventDefault();
                        testUpdate();
                        break;
                }
            }
        });

        // Initialize
        console.log('🎨 CasparCG Lower Third Template loaded');
        console.log('🎮 Test commands: Ctrl+1 (show), Ctrl+2 (hide), Ctrl+3 (update)');
        console.log('📡 Ready for CasparCG commands');

        // Auto-show for development (remove in production)
        if (window.location.search.includes('autoshow')) {
            setTimeout(testShow, 1000);
        }

        // Notify CasparCG that template is ready
        try {
            if (typeof CasparCG !== 'undefined') {
                CasparCG.onLoad();
            }
        } catch (e) {
            // CasparCG object not available (running outside CasparCG)
        }
    </script>
</body>
</html>
